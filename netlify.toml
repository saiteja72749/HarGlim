# Netlify deploy for the Next.js app (server-rendered pages, image optimisation and the
# security headers in next.config.mjs all need Netlify's Next.js runtime, so this site is
# deployed from Git or the Netlify CLI rather than as a drag-and-drop static folder).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node.js 20.9+.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # NEXT_PUBLIC_* values are inlined into the browser bundle at build time, so they are
  # public by design (no secrets here). Changing one needs a redeploy.
  NEXT_PUBLIC_API_URL = "https://harglimpublish-backend.onrender.com/api"
  # Canonical site URL for metadata, sitemap.xml, robots.txt and Open Graph links.
  NEXT_PUBLIC_APP_URL = "https://harglimpublishers.com"
  # Google Sign-In OAuth client ID (public). The Netlify domain must be listed under
  # Authorized JavaScript origins for this client in Google Cloud Console.
  NEXT_PUBLIC_GOOGLE_CLIENT_ID = "13886691041-flfn7g4qteies5jul4efud04v826oc3q.apps.googleusercontent.com"
[[plugins]]
  package = "@netlify/plugin-nextjs"
